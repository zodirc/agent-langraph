<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <title>监控 — Agent Runtime</title>
  <link rel="stylesheet" href="/static/terminal.css?v=ui-8" />
  <link rel="stylesheet" href="/static/platform.css?v=ui-8" />
  <link rel="stylesheet" href="/static/dashboard.css?v=ui-10" />
</head>
<body class="platform-shell" data-active-page="dashboard">
  <div id="platform-nav"></div>
  <div class="dashboard-page">
    <header class="dashboard-header">
      <div class="dashboard-header-text">
        <h1>Agent 任务监控</h1>
        <p class="dashboard-sub">任务状态、死信队列与运行时指标概览（每 10 秒自动刷新）</p>
      </div>
      <div class="dashboard-toolbar" aria-label="运维链接">
        <a
          id="dashboard-metrics-link"
          class="dashboard-toolbar-btn"
          href="/metrics"
          target="_blank"
          rel="noopener noreferrer"
          title="Prometheus 文本格式抓取端点，供 Prometheus / Grafana 采集"
        >
          <span class="dashboard-toolbar-title">Prometheus 抓取</span>
          <code class="dashboard-toolbar-path">/metrics</code>
        </a>
        <a
          class="dashboard-toolbar-btn dashboard-toolbar-btn-secondary"
          href="/health"
          target="_blank"
          rel="noopener noreferrer"
          title="运行时健康检查 JSON"
        >
          <span class="dashboard-toolbar-title">健康检查</span>
          <code class="dashboard-toolbar-path">/health</code>
        </a>
      </div>
    </header>
    <main class="dashboard-main">
      <section id="metrics-cards" class="cards" aria-label="指标卡片"></section>
      <section class="dashboard-section">
        <h2>最近任务</h2>
        <table id="tasks-table">
          <thead><tr><th>ID</th><th>状态</th><th>节点</th><th>目标</th><th>更新</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="llm-panel" class="dashboard-section llm-panel" hidden>
        <div class="llm-panel-header">
          <h2>LLM 交互</h2>
          <p id="llm-panel-meta" class="dashboard-sub"></p>
          <button type="button" id="llm-panel-close" class="dashboard-toolbar-btn dashboard-toolbar-btn-secondary">关闭</button>
        </div>
        <div id="llm-panel-filters" class="llm-panel-filters" hidden>
          <label class="llm-filter-label" for="llm-index-select">查看第</label>
          <select id="llm-index-select" class="llm-index-select" aria-label="选择第几次 LLM 交互">
            <option value="">加载中…</option>
          </select>
          <span class="llm-filter-label">次</span>
          <span id="llm-filter-hint" class="llm-filter-hint"></span>
        </div>
        <div id="llm-interactions-list" class="llm-interactions-list"></div>
      </section>
      <section class="dashboard-section">
        <h2>死信队列 (DLQ)</h2>
        <table id="dlq-table">
          <thead><tr><th>ID</th><th>重试</th><th>错误</th><th>入队时间</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
      <p id="dashboard-status" class="dashboard-status" role="status" hidden></p>
    </main>
  </div>
  <script src="/static/platform-nav.js?v=6"></script>
  <script src="/static/platform-auth.js?v=7"></script>
  <script src="/static/dashboard.js?v=5"></script>
</body>
</html>
