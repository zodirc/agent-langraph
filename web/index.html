<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Runtime CLI</title>
  <link rel="stylesheet" href="/static/terminal.css?v=state-debug-2" />
</head>
<body>
  <div class="terminal">
    <header class="terminal-header">
      <select id="theme-select" class="theme-select" title="主题">
        <option value="dark">深色</option>
        <option value="light">淡色</option>
      </select>
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">agent-langraph — runtime cli</span>
      <div class="header-actions">
        <button id="state-debug-btn" type="button" class="flow-btn" title="查看当前会话 AgentState">State</button>
        <button id="flow-open-btn" type="button" class="flow-btn">Flow</button>
      </div>
      <div class="header-badges">
        <span id="env-badge" class="badge badge-env">loading</span>
        <span id="session-badge" class="badge badge-session" title="当前会话 ID">session …</span>
      </div>
    </header>
    <div class="terminal-main">
      <main id="output" class="terminal-output"></main>
      <aside class="history-pane" id="history-pane">
        <div class="history-head">
          <h3 class="history-title">历史会话</h3>
          <button id="history-refresh-btn" type="button" class="flow-btn">刷新</button>
        </div>
        <div class="history-list" id="history-list">
          <p class="flow-empty">暂无历史会话。</p>
        </div>
        <div id="flow-cache" style="display:none">
          <p class="flow-meta" id="flow-meta">等待任务运行</p>
          <p class="flow-task" id="flow-task">task: -</p>
          <div class="flow-graph" id="flow-graph">
            <p class="flow-empty">流程图等待任务数据…</p>
          </div>
          <div class="flow-timeline" id="flow-timeline">
            <p class="flow-empty">暂无节点数据。运行任务后将自动显示。</p>
          </div>
        </div>
      </aside>
      <aside class="session-files-pane collapsed" id="session-files-pane">
        <button id="session-files-toggle" type="button" class="session-files-tab" title="会话文件">
          Files
        </button>
        <div class="session-files-body">
          <div class="session-files-head">
            <h3 class="history-title">会话文件</h3>
            <div class="session-files-actions">
              <button id="session-files-up-btn" type="button" class="flow-btn">上级</button>
              <button id="session-files-refresh-btn" type="button" class="flow-btn">刷新</button>
            </div>
          </div>
          <div class="session-files-meta" id="session-files-meta">等待会话…</div>
          <div class="session-files-breadcrumb" id="session-files-breadcrumb"></div>
          <div class="session-files-list" id="session-files-list">
            <p class="flow-empty">暂无文件。</p>
          </div>
          <p class="session-files-tip">双击文件可打开实时预览窗口。</p>
        </div>
      </aside>
    </div>
    <form id="command-form" class="terminal-input-row" autocomplete="off">
      <label for="command-input" class="prompt">&gt;</label>
      <input
        id="command-input"
        type="text"
        list="command-suggestions"
        placeholder="输入任务目标，或 /help 查看命令"
        autofocus
      />
      <button id="stop-btn" type="button" class="stop-btn" disabled>Stop</button>
    </form>
    <datalist id="command-suggestions"></datalist>
  </div>
  <dialog id="state-debug-modal" class="state-debug-modal">
    <div class="state-debug-shell">
      <header class="state-debug-head">
        <div>
          <h3 class="state-debug-title">AgentState 调试</h3>
          <p class="state-debug-meta" id="state-debug-meta">加载中…</p>
        </div>
        <div class="state-debug-source-tabs" id="state-debug-source-tabs" role="tablist">
          <button type="button" class="state-debug-source-btn selected" data-source="merged">合并</button>
          <button type="button" class="state-debug-source-btn" data-source="live">Live</button>
          <button type="button" class="state-debug-source-btn" data-source="store">快照</button>
        </div>
        <div class="state-debug-actions">
          <label class="state-debug-toggle">
            <input type="checkbox" id="state-debug-live" checked />
            自动刷新
          </label>
          <button type="button" id="state-debug-refresh-btn" class="flow-btn">刷新</button>
          <button type="button" id="state-debug-close-btn" class="flow-btn">关闭</button>
        </div>
      </header>
      <div class="state-debug-body">
        <aside class="state-debug-keys" id="state-debug-keys">
          <p class="flow-empty">等待数据…</p>
        </aside>
        <pre class="state-debug-json" id="state-debug-json">{}</pre>
      </div>
    </div>
  </dialog>
  <script src="/static/app.js?v=state-debug-2"></script>
</body>
</html>
