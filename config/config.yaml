# 本地 / 非容器：默认读本文件。
# Docker Compose 部署请改 config.docker.yaml（CONFIG_PATH=/app/config/config.docker.yaml）。

model:
  # anthropic | openai | deepseek | glm | openai_compat（自定义 OpenAI 兼容代理）
  provider: ${MODEL_PROVIDER:anthropic}
  name: ${MODEL_NAME:}
  # 留空则按 provider 使用默认 base_url；也可用 MODEL_BASE_URL 覆盖
  base_url: ${MODEL_BASE_URL:}
  # 密钥优先读各厂商环境变量（见 .env.example），其次 MODEL_API_KEY
  api_key: ${MODEL_API_KEY:}
  enabled: ${MODEL_ENABLED:true}
  temperature: 0
  max_tokens: 8192
  max_tokens_by_purpose:
    planning: 4096
    reasoning: 8192
    writing: 16384
    routing: 1024
  # 模型上下文窗口（单次请求 input+output 上限，用于 UI 占用条）
  context_window: 200000
  # 可选：多模型目录（切换模型时共用同一会话上下文，窗口大小随模型变化）
  # catalog:
  #   - id: claude-sonnet
  #     label: Claude Sonnet
  #     provider: anthropic
  #     model_name: ${MODEL_NAME}
  #     context_window_tokens: 200000
  timeout: 120
  max_retries: 2

storage:
  backend: sqlite   # sqlite | postgres
  postgres_url: ${DATABASE_URL:}
  postgres_pool_max_size: 10
  checkpoint_backend: sqlite
  sqlite_path: ./data/db/agent.db
  checkpoint_sqlite_path: ./data/db/agent_checkpoints.db
  vectorstore_path: ./data/vectorstore
  log_path: ./data/logs/agent.log

app:
  env: development
  port: 8000
  debug: true
  secret_key: ${APP_SECRET_KEY:dev-secret}

knowledge:
  backend: chroma   # chroma | qdrant
  content_dir: knowledge   # repo-relative markdown seed dir; or absolute path
  domain_paths:
    common: knowledge/common
    code: knowledge/code
    writing: knowledge/writing
  # local_minilm: sentence-transformers（Docker 镜像内已预置）| openai_compat / voyage-3: 可选外接 API
  embedding_model: ${EMBEDDING_MODEL:local_minilm}
  # Production (zh/en/code): consider bge-m3 or voyage-3; use embedding_meta + EMBEDDING_AUTO_REINDEX
  embedding_base_url: ${EMBEDDING_BASE_URL:}
  embedding_api_model: ${EMBEDDING_API_MODEL:}
  embedding_api_key: ${EMBEDDING_API_KEY:}
  embedding_timeout_sec: 120
  local_embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
  local_embedding_device: cpu
  local_embedding_cache_dir: ./data/models/sentence-transformers
  top_k: 8
  similarity_threshold: 0.3
  collection_name: agent_knowledge
  qdrant_url: ${QDRANT_URL:}
  qdrant_path: ./data/vectorstore/qdrant

auth:
  enabled: ${AUTH_ENABLED:false}
  require_in_production: true   # refuse startup when APP_ENV=production and auth disabled
  jwt_expire_minutes: 480
  api_keys:
    - key: ${SERVICE_API_KEY:}
      user_id: service-bot
      role: admin
      # tenant_id: acme          # optional: bind API key to a tenant
  users:
    - username: admin
      password: ${ADMIN_PASSWORD:admin}
      # password_hash: pbkdf2:...  # optional: use hash_password() instead of plaintext
      user_id: admin
      role: admin
      # tenant_id: default       # optional: default tenant for JWT

supervisor:
  max_workers: 4
  worker_retries: 2

batch:
  max_workers: 4

scheduler:
  enabled: true

task_queue:
  poll_seconds: 10
  max_per_tick: 4
  starvation_sec: 300
  starvation_max_boost: 3

agent:
  # Optional extra instructions appended to built-in system prompt (not shown in Web CLI)
  prompt_extra: ""

session:
  enabled: true
  one_task_per_window: true   # 同一会话窗 = 一个 task_id（与 session_id 相同）
  # Web /chat: interaction_mode in input_payload (chat|engineering|writing) — see docs/CODE_AND_ENGINEERING_PATHS.md
  max_history_turns: 40
  max_history_chars: 48000
  compress_enabled: true      # 超出上限时自动裁剪较早消息
  memory_retrieval_enabled: true   # 多轮会话在 skip_retrieval 时仍检索 session memory
  turn_policy:
    enabled: true
    default_suspend_when_mission_active: true
    resume_on_kinds: [manuscript]
    isolate_on_kinds: [qa, code, interactive_app, small_project]
    min_kind_confidence: 0.35
    isolate_when_empty_goal: true
    audit_decisions: true
    continue_goal_patterns:
      - '(?i)(续写|继续写|继续|追加|下一章|接着写|写下去|append|continue)'
    llm_intent:
      enabled: true
      min_confidence: 0.55
      max_goal_chars: 2000

performance:
  fast_reasoning_enabled: false
  artifact_edit_fast_path: true
  qa_mode_tools_resident: true
  skip_retrieval_when_no_tools: true
  stream_save_every_node: false
  stream_draft_persist_enabled: true   # 流式 answer_delta 增量落库，刷新后可恢复已生成文本
  stream_draft_save_interval_sec: 2.0
  stream_draft_save_min_chars: 80
  chat_message_persist_enabled: true      # Phase 2: message table + structured_blocks
  chat_message_flush_interval_sec: 2.0
  chat_message_flush_min_events: 4
  reasoning_trace_enabled: true
  reasoning_trace_verbose: true    # 节点上下文、检索/工具详情、更小流式增量
  reasoning_trace_max_chars: 48000
  reasoning_trace_progress_interval: 200
  reasoning_trace_show_thinking: true   # 兼容旧键；与 thinking_stream_enabled 等效时可二选一
  thinking_stream_enabled: true         # 推送代理 thinking 块 → SSE thinking_delta（独立于 verbose trace）
  answer_stream_enabled: true           # reasoning summary 增量推到 SSE answer_delta
  artifact_stream_enabled: true          # artifact 正文增量 → SSE writing_delta（独立于 thinking / answer）
  artifact_stream_max_chars: 200000
  artifact_generation:
    stream_max_retries: 2               # 流式 transport 失败可重试次数（不含首次）
    max_stream_duration_sec: 600        # 单次流式读超时（秒）
    max_accumulated_chars: 120000       # tool args 累积上限，超限熔断
    buffer_stall_trace_chars: 8000      # 超过且 content 未出时附带诊断前缀
    buffer_stall_preview_chars: 200
    partial_commit_on_disconnect: true  # 断流时若有 partial content 则提交

memory:
  task_boost: 0.35
  session_boost: 0.25
  writeback:
    skip_when:
      - status: REJECTED
      - structured_key: parser_fallback
    index_kinds: [qa, manuscript, code, retry_recovery, general]

display:
  compose:
    preserve_code_whitespace: true
    preview_max_chars: 8000
  stream:
    include_artifact_code: true   # used when code_artifact.enabled=false
    max_artifact_stream_chars: 32000

# Code artifact pipeline: compile verify + LLM repair (compiler stderr only; no style/indent hardcoding).
# See docs/CODE_ARTIFACT_PIPELINE.md
code_artifact:
  enabled: true
  output:
    hide_unverified_code: true
    failure_message: >
      代码未通过编译校验，本次不展示可能错误的源码。
      请重试；技术细节见推理 trace（code_verify_reports）。
  repair:
    enabled: true
    llm_purpose: reasoning   # LLM purpose for compile-error repair
  stream:
    mode: composed_at_end   # composed_at_end | artifact_incremental
  verify:
    enabled: true
    on_failure: repair      # repair | mark_failed — only LLM + compiler stderr
    max_attempts: 3
    timeout_sec: 15
    workspace_root: ./data/code_verify
  backends:
    cpp:
      enabled: true
      source_extension: .cpp
      compile_cmd: [g++, -std=c++17, -Wall, -Wextra, -c, "{file}"]
    python:
      enabled: true
      source_extension: .py
      compile_cmd: [python3, -m, py_compile, "{file}"]
  default_backend_by_language:
    cpp: cpp
    c++: cpp
    python: python
    py: python
  default_backend_by_extension:
    .cpp: cpp
    .cc: cpp
    .cxx: cpp
    .py: python

delivery:
  by_kind:
    interactive_app:
      primary: tool_write
      secondary: reasoning_artifacts
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    small_project:
      primary: tool_write
      secondary: reasoning_artifacts
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    code:
      primary: tool_write
      secondary: reasoning_artifacts
      default_extension: ".cpp"
      preserve_whitespace: true
      rewrite_manuscript_filenames: true
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    qa:
      primary: reasoning_summary

# Intent observation (pre-planning L2 model layer — see docs/INTENT_OBSERVATION_AND_OMAW_MIGRATION_PLAN.md)
intent_observation:
  enabled: true
  shadow_mode: false
  low_confidence_threshold: 0.55
  primary_model: ""
  fallback_model: ""

# Post-planning route alignment (see docs/ROUTE_AUDIT.md): kinds + conflicts, not per-user-string hacks
route_audit:
  enabled: true
  min_kind_score: 0.35
  reflection_on_misroute: true
  max_planning_revisions: 1
  code_extensions: [".cpp", ".cc", ".cxx", ".hpp", ".h", ".c", ".py", ".rs", ".go", ".java", ".js", ".ts"]
  manuscript_body_names: ["novel.txt", "body.txt"]
  kinds:
    code:
      weight: 1.0
      patterns:
        - '(?i)(请直接|帮我).*(生成|写出|落盘).*(项目|文件|源码|程序)'
        - '(?i)\b(c\+\+|cpp|python|java|javascript|typescript|golang|rust|algorithm)\b'
        - '(?i)\b(source\s*code|compile|executable|indentation|linked\s*list)\b'
        - '(?i)\.(cpp|hpp|cc|py|rs|go)\b'
        - '(?i)(代码|缩进|源码)'
      structural:
        - code_filename_in_tools
    manuscript:
      weight: 1.0
      patterns:
        - '(?i)\b(novel|chapter|outline|manuscript|fiction|prose)\b'
        - '(?i)(小说|章节|大纲|续写|万字)'
      structural:
        - mission_writing
        - long_form_chars_requested
    interactive_app:
      weight: 1.05
      patterns:
        - '(?i)\b(2048|小游戏|html5?\s*game|browser\s*game|canvas)\b'
        - '(?i)\b(index\.html|game\.js|static\s*(web|page)|网页游戏)\b'
        - '(?i)(浏览器.*游戏|前端.*demo|html.*demo)'
    small_project:
      weight: 1.0
      patterns:
        - '(?i)\b(makefile|cmake|multi[- ]file|小项目|样例工程)\b'
        - '(?i)\b(make\s+demo|项目文件|构建文件)\b'
      structural:
        - makefile_in_tools
    qa:
      weight: 0.8
      patterns:
        - '(?i)^(what|who|how|why|explain|describe)\b'
        - '(?i)(什么|为何|怎么|是否|为什么)'
      structural:
        - planning_skip_retrieval_no_tools
    retry_recovery:
      weight: 1.1
      patterns:
        - '(?i)\b(retry|again|redo|previous\s+failed)\b'
        - '(重新|再试|未成功|之前.*失败)'
      structural:
        - session_outcomes_rejected_recent
  conflicts:
    - when_kind: code
      planned_route: writing_artifact
      action: disable_writing_force_reasoning
    - when_kind: code
      planned_route: writing_tools_only
      action: disable_writing_force_reasoning
    - when_kind: retry_recovery
      planned_route: writing_artifact
      unless_kind: manuscript
      action: disable_writing_force_reasoning
    - when_kind: qa
      planned_route: writing_artifact
      action: disable_writing_force_reasoning
    - when_kind: interactive_app
      planned_route: writing_artifact
      action: disable_writing_force_reasoning
    - when_kind: small_project
      planned_route: writing_artifact
      action: disable_writing_force_reasoning

# Intent → mode routing (see docs/ENGINEERING_AGENT_SANDBOX_PROPOSAL.md)
mode_routing:
  by_intent:
    qa: qa_mode
    general: qa_mode
    manuscript: manuscript_mode
    interactive_app: engineering_mode
    small_project: engineering_mode
    code: engineering_mode
    retry_recovery: qa_mode

mode_contracts:
  qa_mode:
    allowed_tools:
      - read_text_artifact
      - write_text_artifact
      - append_text_artifact
      - edit_text_artifact
      - calculator
      - get_runtime_info
    delivery:
      primary: reasoning_summary
      secondary: null
    execution:
      path: reasoning
      max_steps: 4
      max_repair_attempts: 0
    verify:
      enabled: false
    guards:
      forbid_routes: []
      force_isolate_from: []
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only
  manuscript_mode:
    allowed_tools:
      - read_text_artifact
      - write_text_artifact
      - append_text_artifact
      - edit_text_artifact
      - calculator
      - get_runtime_info
    delivery:
      primary: reasoning_summary
      secondary: null
    execution:
      path: reasoning
      max_steps: 6
      max_repair_attempts: 0
    verify:
      enabled: false
    guards:
      forbid_routes: []
      force_isolate_from: []
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only
  engineering_mode:
    allowed_tools: [mkdir_path, write_file, read_file, verify_backend]
    delivery:
      primary: tool_write
      secondary: reasoning_artifacts
    execution:
      path: engineering_bounded
      max_steps: 6
      max_repair_attempts: 3
    verify:
      enabled: true
      backend_selector: by_intent
    guards:
      forbid_routes: [writing_manuscript, mission_writing]
      force_isolate_from: [manuscript_mode]
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only

project_verify:
  enabled: true
  timeout_sec: 30
  max_concurrent_verifies: 2
  max_files: 64
  max_file_bytes: 524288
  workspace_root: ./data/project_verify
  backends:
    web_html_js:
      enabled: true
      commands:
        syntax_check: [node, --check, "{entry_js}"]
      required_files: [index.html]
      entry_js_names: [game.js, main.js, app.js]
    make_cpp_demo:
      enabled: true
      commands:
        build: [make, demo]
      required_files: [Makefile]
      allowed_targets: [demo]
  backend_by_intent:
    interactive_app: web_html_js
    small_project: make_cpp_demo
  backend_by_language:
    cpp: cpp
    c++: cpp
    python: python
    py: python

reflection:
  enabled: true
  max_rounds: 2
  route_audit_on_misroute: true

reasoning:
  mode: direct   # direct | cot

resource:
  default_token_budget: ${DEFAULT_TOKEN_BUDGET:0}
  default_cost_budget: ${DEFAULT_COST_BUDGET:0}
  cost_per_1k_tokens: 0
  downgrade_ratio: 0.8
  downgrade_max_tokens: 2048
  fallback_model: ${MODEL_FALLBACK_NAME:}

output_guard:
  enabled: true
  llm_review: false
  pii_prose_only: true   # PII regex only on prose; fenced/inline code excluded

llm_purpose:
  writing:
    structured_output: tool
    fallback: json_text
    thinking_may_appear: true

agent:
  tool_exec_max_workers: 4

artifacts:
  base_path: ./data/artifacts
  max_write_bytes: 524288
  max_file_bytes: 5242880
  chunk_chars: 3500
  max_chunks_per_turn: 4
  max_chars_per_turn: 14000

tools:
  http_timeout: 30
  http: []

mcp:
  enabled: ${MCP_ENABLED:false}
  timeout: 30
  max_failures_before_evict: 3
  auto_evict: true
  register_resources: true
  register_prompts: false
  servers:
    - name: stub
      transport: stdio
      command: python3
      args: ["-m", "app.mcp_stubs.stdio_server"]
      prefix: mcp
      required_role: user
      risk_level: LOW

policy:
  auto_reject_risk_level: CRITICAL
  require_review_risk_level: HIGH
  max_retry_count: 3
  review_timeout_enabled: true
  review_timeout_minutes: 60
  review_timeout_action: reject   # reject | escalate
  review_timeout_poll_seconds: 30

queue:
  backend: memory   # memory | celery (celery 需 Redis + worker: celery -A app.services.celery_tasks worker)
  redis_url: ${REDIS_URL:redis://localhost:6379/0}

cli:
  api_base_url: http://127.0.0.1:8000
  api_key: ${SERVICE_API_KEY:}

observability:
  langsmith_enabled: false
  langsmith_api_key: ${LANGCHAIN_API_KEY}
  langsmith_project: agent-langraph
  metrics_enabled: true
  # 监控页：按 task/session 查看 LLM 请求与响应
  llm_interaction_log_enabled: true
  llm_interaction_log_max_chars: 200000           # 单字段最大字符（20 万），超出截断
  llm_interaction_log_max_per_task: 120           # 超过则删最旧
  llm_interaction_log_max_bytes_per_task: 1073741824  # 单会话/task 日志总大小 1GB，超过则删最旧

secrets:
  backend: ${SECRETS_BACKEND:env}   # env | k8s | vault

rate_limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  user_per_minute: 60
  ip_per_minute: 100
  window_sec: 60
  use_redis: ${RATE_LIMIT_REDIS:false}

checkpoint:
  retention_days: 30
  cleanup_enabled: true
  corruption_detection_enabled: true
  auto_reset_on_corrupt: false
  max_node_repeat: 10

graph_runner:
  backpressure_enabled: true
  max_concurrent: 8
  queue_timeout_sec: 30

llm:
  circuit_breaker_enabled: false
  failure_threshold: 5
  recovery_timeout_seconds: 60

context_compress:
  semantic_enabled: false
  min_chars_for_semantic: 4000
  keep_recent_turns: 6
  summary_max_chars: 1200
  min_ratio: 0.5   # CI gate: mean compression ratio must be >= this for long histories
  extractive_enabled: true       # P0-2: sentence-level keep for knowledge/tool buckets
  entity_retention_min: 0.9      # CI gate after semantic/extractive compression

# ADR: docs/ADR_CONTEXT_GOVERNANCE.md — unified prompt context gateway
context_governance:
  enabled: true
  default_token_budget: 64800
  # IDE 会话上下文窗口（占用条刻度，切换模型不变；对齐 Cursor/Copilot）
  session_context_window: 64800
  # P0-1: 预算随模型窗口自适应（默认关，灰度后开启）
  window_adaptive_budget: false
  window_utilization: 0.6
  prompt_budget_floor: 12000
  prompt_budget_ceiling: 160000
  bucket_caps_scale_with_budget: true

rag:
  chunk_enabled: true
  domains: [project_rules, story_bible, outline, chapter_facts, external_reference]
  writing_require_citations: true
  rerank_enabled: true
  rerank_backend: lexical          # lexical | cross_encoder | cohere
  # Production: cross_encoder (e.g. BAAI/bge-reranker-v2-m3) or cohere for quality
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_candidate_k: 24
  fetch_k_multiplier: 4
  bm25_k1: 1.5
  bm25_b: 0.75
  max_chunks_per_doc: 2
  chunk_enabled: true
  chunk_min_chars: 600
  chunk_max_chars: 1200
  chunk_overlap_chars: 150
  chunk_max_chars_writing: 1000
  chunk_overlap_chars_writing: 120
  chunk_max_chars_code: 900
  chunk_overlap_chars_code: 80
  chunk_adjacency_enabled: true
  chunk_adjacency_radius: 1
  cohere_api_key: ${COHERE_API_KEY:}
  cohere_rerank_model: rerank-english-v3.0
  citation_enabled: false
  faithfulness_check_enabled: false
  faithfulness_llm_enabled: false
  faithfulness_threshold: 0.7
  eval_recall_at_k: 5
  eval_min_recall: 0.8
  eval_min_mrr: 0.5
  eval_min_faithfulness: 0.75
  relevance_gate_enabled: true
  rerank_min_score: 0.25
  min_relevant_hits: 1
  relevance_relative_ratio: 0.45
  adjacency_max_rank: 2
  snippet_enabled: true
  snippet_max_sentences: 5

# Evidence operating system — retrieval governance (see docs/RETRIEVAL_OPTIMIZATION_EXECUTION_PLAN.md)
retrieval:
  policy_version: v2
  enable_evidence_pipeline: true
  enable_admission_gate: true
  enable_snippet_first: true
  admission_gate_mode: soft          # soft: log + fallback; hard: strict filter
  log_failure_taxonomy: true
  query_rewrite_enabled: true
  query_rewrite_max_retries: 1
  shadow_admission_gate: true        # log hard-gate outcome while in soft mode
  unified_hierarchy: true           # user/tool/memory/retrieval layered evidence
  lexical_rrf_weight: 1.8
  evidence_token_budget: 4000
  budget_link_context: false       # P1-2: derive from retrieved_knowledge bucket cap
  query_rewrite_llm: false         # P1-1: LLM rewrite on low recall (gate_all_filtered)
  multi_query_enabled: false       # P1-1: rule-based multi-query expansion
  multi_query_max: 3
  fts_enabled: false               # P1-1: SQLite FTS5 keyword index (non-Postgres)
  embedding_dedup_enabled: false
  snippet_dual_track: false
  cross_encoder_min_query_len: 12
  cross_encoder_max_docs: 32
  rerank_timeout_sec: 8.0
  citation_check_strictness: basic   # off | basic | strict
  snippet_max_chars: 2000
  max_chunks_per_source: 2
  min_source_diversity: 2
  neighborhood_expand_radius: 1
  purpose_thresholds:
    fact_qa: 0.45
    comparative_summary: 0.25
    procedural_howto: 0.35
    code_fix: 0.40
    planning_background: 0.30
    general_grounded: 0.30
  purpose_top_k:
    fact_qa: 5
    comparative_summary: 10
    procedural_howto: 8
    code_fix: 6
    planning_background: 6
    general_grounded: 8
  source_authority_prior:
    user_input: 1.0
    tool_result: 0.95
    user_upload: 0.90
    official_docs: 0.85
    knowledge: 0.70
    memory: 0.55
    adjacency: 0.40
    discussion: 0.35

embedding:
  dimension: 0          # 0 = probe at runtime
  distance_metric: cosine
  version: v1
  auto_reindex_on_incompatibility: false

skill:
  enabled: true
  runtime_policy_enabled: true
  config_dir: config/skills
  data_dir: data/skills
  packages_dir: config/skill_packages
  packages_enabled: true

memory_compress:
  enabled: true
  min_chars: 2000

a2a:
  http_forward_enabled: true
  registry_ttl_sec: 300
  self_url: ${A2A_SELF_URL:}

tenant:
  enabled: ${MULTI_TENANT_ENABLED:false}
  max_tasks_per_day: 0          # 0 = unlimited
  max_tokens_per_day: 0
  max_concurrent_tasks: 0
  quota_backend: memory         # memory | redis (multi-instance production)
  quota_use_redis: false        # set true with queue.redis_url when using redis backend
