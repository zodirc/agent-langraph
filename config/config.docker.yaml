# Docker / Compose 部署专用配置（容器内 CONFIG_PATH 指向本文件）
#
# - 数据目录：/data（compose 卷 agent_data）
# - PostgreSQL 主机名：postgres（compose 服务名，非 localhost）
# - Redis 主机名：redis（见 docker-compose.redis.yml 或 ha profile）
# - 环境变量由 docker-compose.yml / .env 注入，见 .env.example

model:
  provider: ${MODEL_PROVIDER:anthropic}
  name: ${MODEL_NAME:}
  base_url: ${MODEL_BASE_URL:}
  api_key: ${MODEL_API_KEY:}
  enabled: ${MODEL_ENABLED:true}
  temperature: 0
  max_tokens: 8192
  max_tokens_by_purpose:
    planning: 4096
    reasoning: 8192
    writing: 16384
    routing: 2048
  timeout_by_purpose:
    routing: 20
  timeout: 120
  max_retries: 2

storage:
  # Docker 默认走 compose 内 PostgreSQL；本地无 Docker 时可设 STORAGE_BACKEND=sqlite
  backend: ${STORAGE_BACKEND:postgres}
  postgres_url: ${DATABASE_URL:postgresql://agent:agent@postgres:5432/agent}
  postgres_pool_max_size: 20
  checkpoint_backend: ${CHECKPOINT_BACKEND:postgres}
  sqlite_path: /data/db/agent.db
  checkpoint_sqlite_path: /data/db/agent_checkpoints.db
  vectorstore_path: /data/vectorstore
  log_path: /data/logs/agent.log

app:
  env: production
  port: 8000
  debug: false
  secret_key: ${APP_SECRET_KEY:change-me-in-production}

knowledge:
  backend: chroma
  content_dir: knowledge
  # 镜像构建时已预置 all-MiniLM-L6-v2（见 Dockerfile + docker-entrypoint.sh 复制到 /data）
  embedding_model: ${EMBEDDING_MODEL:local_minilm}
  local_embedding_model_name: sentence-transformers/all-MiniLM-L6-v2
  local_embedding_device: cpu
  local_embedding_cache_dir: /data/models/sentence-transformers
  top_k: 8
  similarity_threshold: 0.3
  collection_name: agent_knowledge
  qdrant_path: /data/vectorstore/qdrant

rag:
  rerank_enabled: true
  rerank_backend: lexical
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_candidate_k: 24
  fetch_k_multiplier: 4
  bm25_k1: 1.5
  bm25_b: 0.75
  max_chunks_per_doc: 2
  chunk_enabled: true
  chunk_min_chars: 600
  chunk_max_chars: 1200
  chunk_overlap_chars: 150
  chunk_max_chars_writing: 1000
  chunk_overlap_chars_writing: 120
  chunk_max_chars_code: 900
  chunk_overlap_chars_code: 80
  chunk_adjacency_enabled: true
  chunk_adjacency_radius: 1
  relevance_gate_enabled: true
  rerank_min_score: 0.25
  min_relevant_hits: 1
  relevance_relative_ratio: 0.45
  adjacency_max_rank: 2
  snippet_enabled: true
  snippet_max_sentences: 5

retrieval:
  policy_version: v2
  enable_evidence_pipeline: true
  enable_admission_gate: true
  enable_snippet_first: true
  admission_gate_mode: soft
  log_failure_taxonomy: true
  query_rewrite_enabled: true
  query_rewrite_max_retries: 1
  shadow_admission_gate: true
  unified_hierarchy: true
  lexical_rrf_weight: 1.8
  evidence_token_budget: 4000
  budget_link_context: false
  query_rewrite_llm: false
  multi_query_enabled: false
  multi_query_max: 3
  fts_enabled: false
  rerank_timeout_sec: 8.0
  citation_check_strictness: basic
  snippet_max_chars: 2000
  max_chunks_per_source: 2
  min_source_diversity: 2
  purpose_thresholds:
    fact_qa: 0.45
    comparative_summary: 0.25
    procedural_howto: 0.35
    code_fix: 0.40
    planning_background: 0.30
    general_grounded: 0.30
  purpose_top_k:
    fact_qa: 5
    comparative_summary: 10
    procedural_howto: 8
    code_fix: 6
    planning_background: 6
    general_grounded: 8

auth:
  # Compose 默认 APP_ENV=production；生产应开启认证（compose 默认 AUTH_ENABLED=true）
  enabled: ${AUTH_ENABLED:true}
  require_in_production: true
  jwt_expire_minutes: 480
  api_keys:
    - key: ${SERVICE_API_KEY:}
      user_id: service-bot
      role: admin
      # tenant_id: default
  users:
    - username: admin
      password: ${ADMIN_PASSWORD:admin}
      user_id: admin
      role: admin
      # tenant_id: default

supervisor:
  max_workers: 4
  worker_retries: 2

batch:
  max_workers: 4

scheduler:
  enabled: true

agent:
  prompt_extra: ""

session:
  enabled: true
  one_task_per_window: true
  max_history_turns: 40
  max_history_chars: 48000
  compress_enabled: true
  memory_retrieval_enabled: true
  turn_policy:
    enabled: true
    default_suspend_when_mission_active: true
    resume_on_kinds: [manuscript]
    isolate_on_kinds: [qa, code, interactive_app, small_project]
    min_kind_confidence: 0.35
    isolate_when_empty_goal: true
    audit_decisions: true
    continue_goal_patterns:
      - '(?i)(续写|继续写|继续|追加|下一章|接着写|写下去|append|continue)'
    llm_intent:
      enabled: true
      min_confidence: 0.55
      max_goal_chars: 2000

context_governance:
  enabled: true
  default_token_budget: 64800
  window_adaptive_budget: true
  window_utilization: 0.6
  prompt_budget_floor: 12000
  prompt_budget_ceiling: 160000
  bucket_caps_scale_with_budget: true

performance:
  fast_reasoning_enabled: false
  artifact_edit_fast_path: true
  qa_mode_tools_resident: true
  skip_retrieval_when_no_tools: true
  stream_save_every_node: false
  reasoning_trace_enabled: true
  reasoning_trace_verbose: true
  reasoning_trace_max_chars: 48000
  reasoning_trace_progress_interval: 200
  reasoning_trace_show_thinking: true
  thinking_stream_enabled: true
  answer_stream_enabled: true
  artifact_stream_enabled: true
  artifact_stream_max_chars: 200000
  artifact_generation:
    stream_max_retries: 2
    max_stream_duration_sec: 600
    max_accumulated_chars: 120000
    buffer_stall_trace_chars: 8000
    buffer_stall_preview_chars: 200
    partial_commit_on_disconnect: true

# Must mirror config.yaml route_audit (kinds + conflicts); enabled-only is a no-op
route_audit:
  enabled: true
  min_kind_score: 0.35
  reflection_on_misroute: true
  max_planning_revisions: 1
  code_extensions: [".cpp", ".cc", ".cxx", ".hpp", ".h", ".c", ".py", ".rs", ".go", ".java", ".js", ".ts"]
  manuscript_body_names: ["novel.txt", "body.txt"]
  kinds:
    code:
      weight: 1.0
      patterns:
        - '(?i)(请直接|帮我).*(生成|写出|落盘).*(项目|文件|源码|程序)'
        - '(?i)\b(c\+\+|cpp|python|java|javascript|typescript|golang|rust|algorithm)\b'
        - '(?i)\b(source\s*code|compile|executable|indentation|linked\s*list)\b'
        - '(?i)\.(cpp|hpp|cc|py|rs|go)\b'
        - '(?i)(代码|缩进|源码)'
      structural:
        - code_filename_in_tools
    manuscript:
      weight: 1.0
      patterns:
        - '(?i)\b(novel|chapter|outline|manuscript|fiction|prose)\b'
        - '(?i)(小说|章节|大纲|续写|万字)'
      structural:
        - mission_writing
        - long_form_chars_requested
    interactive_app:
      weight: 1.05
      patterns:
        - '(?i)\b(2048|小游戏|html5?\s*game|browser\s*game|canvas)\b'
        - '(?i)\b(index\.html|game\.js|static\s*(web|page)|网页游戏)\b'
        - '(?i)(浏览器.*游戏|前端.*demo|html.*demo)'
    small_project:
      weight: 1.0
      patterns:
        - '(?i)\b(makefile|cmake|multi[- ]file|小项目|样例工程)\b'
        - '(?i)\b(make\s+demo|项目文件|构建文件)\b'
      structural:
        - makefile_in_tools
    qa:
      weight: 0.8
      patterns:
        - '(?i)^(what|who|how|why|explain|describe)\b'
        - '(?i)(什么|为何|怎么|是否|为什么)'
      structural:
        - planning_skip_retrieval_no_tools
    retry_recovery:
      weight: 1.1
      patterns:
        - '(?i)\b(retry|again|redo|previous\s+failed)\b'
        - '(重新|再试|未成功|之前.*失败)'
      structural:
        - session_outcomes_rejected_recent
  conflicts:
    - when_kind: code
      planned_route: writing_manuscript
      action: disable_writing_force_reasoning
    - when_kind: code
      planned_route: writing_artifact
      action: disable_writing_force_reasoning
    - when_kind: code
      planned_route: writing_tools_only
      action: disable_writing_force_reasoning
    - when_kind: retry_recovery
      planned_route: writing_manuscript
      unless_kind: manuscript
      action: disable_writing_force_reasoning
    - when_kind: qa
      planned_route: writing_manuscript
      action: disable_writing_force_reasoning
    - when_kind: interactive_app
      planned_route: writing_manuscript
      action: disable_writing_force_reasoning
    - when_kind: interactive_app
      planned_route: writing_artifact
      action: disable_writing_force_reasoning
    - when_kind: small_project
      planned_route: writing_manuscript
      action: disable_writing_force_reasoning
    - when_kind: small_project
      planned_route: writing_artifact
      action: disable_writing_force_reasoning

mode_routing:
  by_intent:
    qa: qa_mode
    general: qa_mode
    manuscript: manuscript_mode
    interactive_app: engineering_mode
    small_project: engineering_mode
    code: engineering_mode
    retry_recovery: qa_mode

mode_contracts:
  qa_mode:
    allowed_tools:
      - read_text_artifact
      - write_text_artifact
      - append_text_artifact
      - edit_text_artifact
      - calculator
      - get_runtime_info
    delivery:
      primary: reasoning_summary
      secondary: null
    execution:
      path: reasoning
      max_steps: 4
      max_repair_attempts: 0
    verify:
      enabled: false
    guards:
      forbid_routes: []
      force_isolate_from: []
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only
  manuscript_mode:
    allowed_tools:
      - read_text_artifact
      - write_text_artifact
      - append_text_artifact
      - edit_text_artifact
      - calculator
      - get_runtime_info
    delivery:
      primary: reasoning_summary
      secondary: null
    execution:
      path: reasoning
      max_steps: 6
      max_repair_attempts: 0
    verify:
      enabled: false
    guards:
      forbid_routes: []
      force_isolate_from: []
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only
  engineering_mode:
    allowed_tools: [mkdir_path, write_file, read_file, verify_backend]
    delivery:
      primary: tool_write
      secondary: reasoning_artifacts
    execution:
      path: engineering_bounded
      max_steps: 6
      max_repair_attempts: 3
    verify:
      enabled: true
      backend_selector: by_intent
    guards:
      forbid_routes: [writing_manuscript, mission_writing]
      force_isolate_from: [manuscript_mode]
    security:
      shell_access: false
      network_access: false
      path_scope: session_root_only

project_verify:
  enabled: true
  timeout_sec: 30
  max_concurrent_verifies: 2
  max_files: 64
  max_file_bytes: 524288
  workspace_root: /data/project_verify
  backends:
    web_html_js:
      enabled: true
      commands:
        syntax_check: [node, --check, "{entry_js}"]
      required_files: [index.html]
      entry_js_names: [game.js, main.js, app.js]
    make_cpp_demo:
      enabled: true
      commands:
        build: [make, demo]
      required_files: [Makefile]
      allowed_targets: [demo]
  backend_by_intent:
    interactive_app: web_html_js
    small_project: make_cpp_demo
  backend_by_language:
    cpp: cpp
    c++: cpp
    python: python
    py: python

memory:
  task_boost: 0.35
  session_boost: 0.25
  writeback:
    skip_when:
      - status: REJECTED
      - structured_key: parser_fallback
    index_kinds: [qa, manuscript, code, retry_recovery, general]

display:
  compose:
    preserve_code_whitespace: true
    preview_max_chars: 8000
  stream:
    include_artifact_code: true
    max_artifact_stream_chars: 32000
  writing_actions:
    append_body: 继续生成下一章
    write_outline: 生成/更新大纲
    review_chapter: 审阅当前章节
    polish_chapter: 润色当前章节

# See docs/CODE_ARTIFACT_PIPELINE.md (stderr-only repair; no indent/style hardcoding)
code_artifact:
  enabled: true
  output:
    hide_unverified_code: true
    failure_message: >
      代码未通过编译校验，本次不展示可能错误的源码。
      请重试；技术细节见推理 trace（code_verify_reports）。
  repair:
    enabled: true
    llm_purpose: reasoning
  stream:
    mode: composed_at_end
  verify:
    enabled: true
    on_failure: repair
    max_attempts: 3
    timeout_sec: 15
    workspace_root: /data/code_verify
  backends:
    cpp:
      enabled: true
      source_extension: .cpp
      compile_cmd: [g++, -std=c++17, -Wall, -Wextra, -c, "{file}"]
    python:
      enabled: true
      source_extension: .py
      compile_cmd: [python3, -m, py_compile, "{file}"]
  default_backend_by_language:
    cpp: cpp
    c++: cpp
    python: python
    py: python
  default_backend_by_extension:
    .cpp: cpp
    .cc: cpp
    .py: python

delivery:
  by_kind:
    interactive_app:
      primary: tool_write
      secondary: reasoning_artifacts
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    small_project:
      primary: tool_write
      secondary: reasoning_artifacts
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    code:
      primary: tool_write
      secondary: reasoning_artifacts
      default_extension: ".cpp"
      preserve_whitespace: true
      rewrite_manuscript_filenames: true
      forbid_routes: [writing_manuscript, writing_artifact, mission_writing]
    qa:
      primary: reasoning_summary

output_guard:
  enabled: true
  llm_review: false
  pii_prose_only: true

llm_purpose:
  writing:
    structured_output: tool
    fallback: json_text
    thinking_may_appear: true

artifacts:
  base_path: /data/artifacts
  max_write_bytes: 1048576
  max_file_bytes: 20971520
  chunk_chars: 6000
  max_chunks_per_turn: 8
  max_chars_per_turn: 32000

tools:
  http_timeout: 30
  http: []

mcp:
  enabled: false

policy:
  auto_reject_risk_level: CRITICAL
  require_review_risk_level: HIGH
  max_retry_count: 3
  review_timeout_enabled: true
  review_timeout_minutes: 60
  review_timeout_action: reject
  review_timeout_poll_seconds: 30

queue:
  backend: memory
  # HA / 多副本时改为 celery，并启动 redis + celery-worker（docker-compose.ha.yml）
  redis_url: ${REDIS_URL:redis://redis:6379/0}

cli:
  api_base_url: http://127.0.0.1:8000

observability:
  langsmith_enabled: false
  metrics_enabled: true
  llm_interaction_log_enabled: true
  llm_interaction_log_max_chars: 200000
  llm_interaction_log_max_per_task: 120
  llm_interaction_log_max_bytes_per_task: 1073741824

rate_limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # Docker 默认 600/min（对话页轮询）；.env 可设 RATE_LIMIT_USER_PER_MIN 覆盖
  user_per_minute: ${RATE_LIMIT_USER_PER_MIN:600}
  ip_per_minute: ${RATE_LIMIT_IP_PER_MIN:3000}
  window_sec: 60
  use_redis: ${RATE_LIMIT_REDIS:false}

tenant:
  enabled: ${MULTI_TENANT_ENABLED:false}
  max_tasks_per_day: ${TENANT_MAX_TASKS_PER_DAY:0}
  max_tokens_per_day: ${TENANT_MAX_TOKENS_PER_DAY:0}
  max_concurrent_tasks: ${TENANT_MAX_CONCURRENT_TASKS:0}
  # 单副本 compose 用 memory；多副本叠加 docker-compose.redis.yml 并设 quota_backend=redis
  quota_backend: ${TENANT_QUOTA_BACKEND:memory}
  quota_use_redis: ${TENANT_QUOTA_REDIS:false}

# Skills 平台（Docker 默认开启；与 config.yaml 对齐）
skill:
  enabled: true
  runtime_policy_enabled: true
  config_dir: config/skills
  data_dir: data/skills
  packages_dir: config/skill_packages
  packages_enabled: true
