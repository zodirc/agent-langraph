skill_id: api_design
name: API Design
version: "1.0.0"
description: Design REST/HTTP APIs with clear contracts and error models.
summary: API design brief with endpoints, schemas, and versioning notes.
source_type: builtin
status: published
visibility: system_public
base_domain: code
category: code
preferred_execution_mode: single
required_role: user
risk_level: LOW
enabled: true
tags: [code, general]
allowed_tools: [get_runtime_info, read_text_artifact]
planning_overlay: |
  Skill: api_design. Topic: {{goal}}. Cover resources, methods, auth, errors, idempotency, pagination.
reasoning_overlay: |
  Use tables or bullet lists for endpoints; include example request/response shapes.
output_contract:
  require_summary: true
  prefer_structured: true
presentation:
  display_order: 13
  input_form_schema:
    type: object
    properties:
      goal: { type: string, title: "API scope" }
    required: [goal]
  example_prompts: ["Design CRUD API for document management"]
examples:
  - input: "Design tasks API v2"
    output: "Endpoint catalog + schemas"
