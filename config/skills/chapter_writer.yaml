skill_id: chapter_writer
name: Chapter Writer
version: "1.0.0"
description: Write fiction chapters within an existing outline and persist them as text artifacts.
summary: Chapter production skill with outline-first planning and artifact-based delivery.
source_type: builtin
status: published
visibility: system_public
base_domain: document
category: writing
preferred_execution_mode: single
required_role: user
risk_level: LOW
enabled: true
tags: [writing, general]
allowed_tools: [read_text_artifact, append_text_artifact, write_text_artifact]
planning_overlay: |
  Skill: chapter_writer. Task: {{goal}}. Read the relevant outline or prior chapter first, then write or append the chapter content to the correct text artifact.
reasoning_overlay: |
  Keep the user-facing summary concise. Put chapter prose in artifacts, not in the summary field.
output_contract:
  require_summary: true
presentation:
  display_order: 42
  input_form_schema:
    type: object
    properties:
      goal: { type: string, title: "Chapter goal" }
    required: [goal]
  example_prompts: ["Write chapter 3 from existing outline"]
examples:
  - input: "Append chapter 2"
    output: "Chapter written to artifact"
