skill_id: meeting_minutes
name: Meeting Minutes
version: "1.0.0"
description: Turn meeting notes into minutes with decisions and action items.
summary: Minutes with attendees, decisions, owners, and deadlines.
source_type: builtin
status: published
visibility: system_public
base_domain: document
category: document
preferred_execution_mode: single
required_role: user
risk_level: LOW
enabled: true
tags: [document, general]
allowed_tools: [read_text_artifact]
planning_overlay: |
  Skill: meeting_minutes. Source: {{goal}}. Extract decisions, action items (owner, due), open questions.
reasoning_overlay: |
  Format: Summary, Decisions, Action items, Parking lot.
output_contract:
  require_summary: true
  require_action_items: true
presentation:
  display_order: 22
  input_form_schema:
    type: object
    properties:
      goal: { type: string, title: "Meeting notes or transcript" }
    required: [goal]
  example_prompts: ["Minutes from sprint planning"]
examples:
  - input: "Notes from architecture review"
    output: "Structured minutes"
