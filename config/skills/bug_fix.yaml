skill_id: bug_fix
name: Bug Fix
version: "1.0.0"
description: Diagnose and fix bugs with minimal, targeted changes.
summary: Root-cause oriented bug fixing with reproduction steps and patch guidance.
source_type: builtin
status: published
visibility: system_public
base_domain: code
category: code
preferred_execution_mode: single
required_role: user
risk_level: LOW
enabled: true
tags: [code, general]
allowed_tools: [read_text_artifact, get_runtime_info, edit_text_artifact]
planning_overlay: |
  Skill: bug_fix. Goal: {{goal}}. Reproduce, isolate root cause, propose minimal fix; read files before editing.
reasoning_overlay: |
  Report: symptom, root cause hypothesis, fix steps, regression risks.
output_contract:
  require_summary: true
presentation:
  icon: bug
  display_order: 11
  input_form_schema:
    type: object
    properties:
      goal: { type: string, title: "Bug description" }
    required: [goal]
  example_prompts: ["Fix null pointer when user logs out"]
examples:
  - input: "Login fails after token refresh"
    output: "Root cause + minimal fix plan"
