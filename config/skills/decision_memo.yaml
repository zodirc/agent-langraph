skill_id: decision_memo
name: Decision Memo
version: "1.0.0"
description: Decision memo comparing options with recommendation.
summary: Options, tradeoffs, recommendation, and next steps.
source_type: builtin
status: published
visibility: system_public
base_domain: analysis
category: analysis
preferred_execution_mode: single
required_role: user
risk_level: LOW
enabled: true
tags: [analysis, general]
allowed_tools: [get_runtime_info, read_text_artifact]
planning_overlay: |
  Skill: decision_memo. Decision: {{goal}}. Compare ≥2 options with criteria matrix; state recommendation clearly.
reasoning_overlay: |
  Include risks, cost/complexity, and reversible vs irreversible choice.
output_contract:
  require_summary: true
  prefer_structured: true
presentation:
  display_order: 32
  input_form_schema:
    type: object
    properties:
      goal: { type: string, title: "Decision topic" }
    required: [goal]
  example_prompts: ["Choose between Redis and PG for queue"]
examples:
  - input: "Pick embedding provider"
    output: "Decision memo with recommendation"
