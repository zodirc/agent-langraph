# 本地默认：HTTPS（Caddy）+ 源码挂载 + uvicorn --reload
#
# 与 docker-compose.yml 叠加使用（推荐，亦见 Makefile `make up`）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 平台 https://localhost:${HOST_PORT}/  对话 /chat （端口见 .env，默认 8080）
# - 改 app/：uvicorn 自动 reload
# - 改 web/static：浏览器强刷
# - 改 config/：docker compose ... restart agent

services:
  agent:
    environment:
      APP_ENV: development
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
    volumes:
      - agent_data:/data
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./web:/app/web:ro
      - ./knowledge:/app/knowledge:ro
      # open RAG 评测脚本与报告（可写 normalized/、reports/）
      - ./tests/eval:/app/tests/eval:rw
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    # 不发布 8000 到宿主机；HTTPS 仅经 Caddy（docker-compose.yml）
