# Agent + 内置 PostgreSQL（业务状态 + LangGraph checkpoint）
#
# 配置：容器内固定 CONFIG_PATH=/app/config/config.docker.yaml（勿改容器内路径）
#       宿主机通过 .env 注入环境变量，映射到 config.docker.yaml 的 ${VAR:default}
#
# 本地默认（HTTPS + 热更新）：make init && make up
#   平台 https://localhost:${HOST_PORT:-8080}/  对话 /chat
#
# 生产模式（HTTPS，无热更新，代码在镜像内）：
#   make prod
#   或 docker compose up -d --build
#
# 多租户 + Redis 配额（多副本）：
#   docker compose -f docker-compose.yml -f docker-compose.redis.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-langraph-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    image: agent-langraph:latest
    container_name: agent-langraph
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      APP_ENV: production
      # 存储：容器内 PostgreSQL（服务名 postgres）
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent}
      CHECKPOINT_BACKEND: postgres
      # 模型（见 .env.example：MODEL_PROVIDER + 对应厂商 API Key）
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_ENABLED: ${MODEL_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      # 生产 compose 默认开启认证（APP_ENV=production + require_in_production）
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      MULTI_TENANT_ENABLED: ${MULTI_TENANT_ENABLED:-false}
      TENANT_MAX_TASKS_PER_DAY: ${TENANT_MAX_TASKS_PER_DAY:-0}
      TENANT_MAX_TOKENS_PER_DAY: ${TENANT_MAX_TOKENS_PER_DAY:-0}
      TENANT_MAX_CONCURRENT_TASKS: ${TENANT_MAX_CONCURRENT_TASKS:-0}
      TENANT_QUOTA_BACKEND: ${TENANT_QUOTA_BACKEND:-memory}
      TENANT_QUOTA_REDIS: ${TENANT_QUOTA_REDIS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-600}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-3000}
      RATE_LIMIT_REDIS: ${RATE_LIMIT_REDIS:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOCAL_EMBEDDING_CACHE_DIR: /data/models/sentence-transformers
    volumes:
      # 整卷挂载 /data：Chroma、artifact、日志、embedding 缓存（/data/models/sentence-transformers）
      - agent_data:/data
    restart: unless-stopped
    healthcheck:
      # 勿用 /health：写作高峰会跑向量/知识库检查，易超时误判 unhealthy
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    container_name: agent-langraph-caddy
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      DEFAULT_SNI: ${DEFAULT_SNI:-192.168.25.128}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  agent_data:
  agent_pg_data:
  caddy_data:
  caddy_config:
